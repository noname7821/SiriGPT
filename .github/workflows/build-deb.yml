name: Build SiriGPT .deb

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: macos-15

    env:
      THEOS: /tmp/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          xcode-select --install || true
          sudo xcodebuild -license accept || true
          brew update
          brew install --quiet dpkg ldid

          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          which ldid
          ldid -h

      - name: Install Theos
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --recurse-submodules https://github.com/theos/theos.git "$THEOS"
          ls -la "$THEOS" || true
          ls -la "$THEOS/bin" || true
          test -f "$THEOS/bin/dm.pl" || { echo "dm.pl missing"; exit 1; }
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "PATH=$THEOS/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" >> "$GITHUB_ENV"

      - name: Build deb package
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$THEOS/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          echo "PATH=$PATH"
          which dm.pl || true
          ls -l "$THEOS/bin/dm.pl" || true
          make clean || true
          make package

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: sirigpt-deb
          path: packages/*.deb
          if-no-files-found: error
