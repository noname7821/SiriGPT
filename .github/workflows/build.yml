name: Build SiriGPT

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget tar dpkg-dev

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install iOS toolchain
        run: |
          $THEOS/bin/theos-toolchain --install=iphone || true

      - name: Install iOS SDKs
        run: |
          rm -rf $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks

      - name: Build package
        run: |
          make package

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: sirigpt-deb
          path: packages/*.deb
