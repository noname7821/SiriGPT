name: Build SiriGPT

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget tar dpkg-dev

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install iOS SDK
        run: |
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          $THEOS/bin/theos-sdk --install=latest 2>/dev/null || true
          if [ ! -d "$THEOS/sdks/iPhoneOS*.sdk" ]; then
            curl -L -s -o sdk.tar.bz2 https://github.com/theos/sdks/raw/main/SDK/iPhoneOS17.2.sdk.tar.bz2 || curl -L -s -o sdk.tar.bz2 https://github.com/theos/sdks/raw/master/SDK/iPhoneOS17.2.sdk.tar.bz2 || true
            if [ -f sdk.tar.bz2 ]; then
              tar -xf sdk.tar.bz2
              rm -f sdk.tar.bz2
            fi
          fi

      - name: Build package
        run: |
          make package

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: sirigpt-deb
          path: packages/*.deb
